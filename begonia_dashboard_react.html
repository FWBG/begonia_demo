/* FWBG colour system.
   Base values are the brand palette from the June 2025 guidelines; the HSL triplets and the
   -h/-s/-l components mirror the production theme so hsla(var(--x-h),var(--x-s),var(--x-l),a)
   transparency recipes work exactly as they do on fwbg.org. */
:root{
  /* --- Brand palette (guidelines, primary) --- */
  --fwbg-evergreen:#293A2E;   /* PANTONE 5605 */
  --fwbg-meadow:#8EA937;      /* PANTONE 2276 */
  --fwbg-sunstone:#F68A3D;    /* PANTONE 2025 */
  --fwbg-limestone:#F2EDE7;   /* PANTONE 2323 @ 20% */
  --fwbg-mist:#D1DED6;        /* PANTONE 621  — summer */
  --fwbg-red-oak:#380808;     /* PANTONE 4975 — autumn */
  --fwbg-honey:#F2C40F;       /* PANTONE 7406 — autumn */
  --fwbg-koi:#FFCFAB;         /* PANTONE 2015 — autumn */
  --fwbg-solstice:#2B1F4A;    /* PANTONE 2695 — winter */
  --fwbg-frost:#ABE8FA;       /* PANTONE 317  — winter */
  --fwbg-lilac:#D1D6F7;       /* PANTONE 2706 — winter */
  --fwbg-riverleaf:#004A4A;   /* PANTONE 3302 — spring */
  --fwbg-petal-pink:#E5ABD4;  /* PANTONE 515  — spring */
  --fwbg-citrus:#FAD68A;      /* PANTONE 2005 — spring */

  /* --- Semantic ramp. Default = institutional / summer (Evergreen) --- */
  --color-primary-darker:hsl(135,15%,5%);   --color-primary-darker-h:135;--color-primary-darker-s:15%;--color-primary-darker-l:5%;
  --color-primary-dark:hsl(128,12%,13%);    --color-primary-dark-h:128;--color-primary-dark-s:12%;--color-primary-dark-l:13%;
  --color-primary:hsl(138,17%,19%);         --color-primary-h:138;--color-primary-s:17%;--color-primary-l:19%;
  --color-primary-light:hsl(136,17%,25%);   --color-primary-light-h:136;--color-primary-light-s:17%;--color-primary-light-l:25%;
  --color-primary-lighter:hsl(131,13%,34%); --color-primary-lighter-h:131;--color-primary-lighter-s:13%;--color-primary-lighter-l:34%;

  --color-accent-darker:hsl(22,68%,46%);    --color-accent-darker-h:22;--color-accent-darker-s:68%;--color-accent-darker-l:46%;
  --color-accent-dark:hsl(22,77%,54%);      --color-accent-dark-h:22;--color-accent-dark-s:77%;--color-accent-dark-l:54%;
  --color-accent:hsl(25,91%,60%);           --color-accent-h:25;--color-accent-s:91%;--color-accent-l:60%;
  --color-accent-light:hsl(25,91%,66%);     --color-accent-light-h:25;--color-accent-light-s:91%;--color-accent-light-l:66%;
  --color-accent-lighter:hsl(25,91%,72%);   --color-accent-lighter-h:25;--color-accent-lighter-s:91%;--color-accent-lighter-l:72%;

  --color-secondary-darker:hsl(74,47%,31%); --color-secondary-darker-h:74;--color-secondary-darker-s:47%;--color-secondary-darker-l:31%;
  --color-secondary-dark:hsl(74,47%,37%);   --color-secondary-dark-h:74;--color-secondary-dark-s:47%;--color-secondary-dark-l:37%;
  --color-secondary:hsl(74,47%,43%);        --color-secondary-h:74;--color-secondary-s:47%;--color-secondary-l:43%;
  --color-secondary-light:hsl(74,47%,55%);  --color-secondary-light-h:74;--color-secondary-light-s:47%;--color-secondary-light-l:55%;
  --color-secondary-lighter:hsl(74,47%,72%);--color-secondary-lighter-h:74;--color-secondary-lighter-s:47%;--color-secondary-lighter-l:72%;

  --color-tertiary:hsl(138,17%,85%);        --color-tertiary-h:138;--color-tertiary-s:17%;--color-tertiary-l:85%;
  --color-member:hsl(20,91%,79%);           --color-member-h:20;--color-member-s:91%;--color-member-l:79%;

  /* Surfaces — Limestone family */
  --color-bg-darker:hsl(39,20%,77%); --color-bg-darker-h:39;--color-bg-darker-s:20%;--color-bg-darker-l:77%;
  --color-bg-dark:hsl(35,23%,86%);   --color-bg-dark-h:35;--color-bg-dark-s:23%;--color-bg-dark-l:86%;
  --color-bg:hsl(33,31%,93%);        --color-bg-h:33;--color-bg-s:31%;--color-bg-l:93%;

/* Type. New Kansas = display only, used sparingly (once per printed side / digital block).

:root{

  --font-secondary:"new-kansas",Georgia,serif;            /* display / headline only */
  --font-display:var(--font-secondary);
  --font-body:var(--font-primary);

  --text-base-size:1.125rem;   /* 18px */
  --text-scale-ratio:1.215;
  --text-unit:var(--text-base-size);
  --text-xs:calc((var(--text-unit) / var(--text-scale-ratio)) / var(--text-scale-ratio));
  --text-sm:calc(var(--text-xs) * var(--text-scale-ratio));
  --text-md:calc(var(--text-sm) * var(--text-scale-ratio) * var(--text-scale-ratio));
  --text-lg:calc(var(--text-md) * var(--text-scale-ratio));
  --text-xl:calc(var(--text-lg) * var(--text-scale-ratio));
  --text-xxl:calc(var(--text-xl) * var(--text-scale-ratio));
  --text-xxxl:calc(var(--text-xxl) * var(--text-scale-ratio));
  --text-xxxxl:calc(var(--text-xxxl) * var(--text-scale-ratio));

  --text-16:16px;

  --heading-line-height:1.2;

  --subheading-line-height:1;
  --heading-font-weight:700;
  --body-font-weight:400;

  --display-font-weight-emphasis:500; /* New Kansas Medium, for key words only */

/* Spacing. Non-linear scale from the production theme (space-unit = 1rem). */

  --space-xxxs:calc(0.375 * var(--space-unit));

  --space-sm:calc(1.125 * var(--space-unit));
  --space-md:calc(2 * var(--space-unit));
  --space-lg:calc(3.125 * var(--space-unit));
  --space-xl:calc(5.125 * var(--space-unit));
  --space-xxl:calc(8.25 * var(--space-unit));
  --space-xxxl:calc(13.25 * var(--space-unit));
  --space-xxxxl:calc(21.5 * var(--space-unit));

  --max-width-sm:48rem;--max-width-md:64rem;--max-width-lg:80rem;--max-width-xl:90rem;

*{box-sizing:border-box;margin:0}
html{font-size:16px}
body{font-family:var(--font-primary);background:var(--surface-page);color:var(--text-body);line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--color-accent-dark);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
header.top{background:var(--color-primary);color:#fff;padding:28px 0 36px}
header.top .logo{width:150px;display:block;color:#fff;margin-bottom:28px}
header.top .logo svg{width:100%;height:auto;display:block}
.eyebrow{font-size:.78rem;letter-spacing:var(--eyebrow-letter-spacing);text-transform:uppercase;font-weight:700;color:var(--fwbg-meadow)}
h1{font-family:var(--font-display);font-weight:500;font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.05;margin:8px 0 12px}
header.top p{max-width:62ch;color:hsla(0,0%,100%,.85);font-size:1.05rem}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:-22px}
.kpi{background:var(--surface-card);border-radius:var(--radius-lg);padding:16px 20px;box-shadow:var(--shadow-sm)}
.kpi b{display:block;font-size:2rem;line-height:1.1;color:var(--text-heading);font-variant-numeric:tabular-nums}
.kpi span{font-size:.85rem;color:var(--text-muted)}

/* toolbar */
.toolbar{position:sticky;top:0;z-index:5;background:var(--surface-page);padding:18px 0 10px;margin-top:10px}
.search{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search .box{flex:1 1 320px;position:relative}
.search input{width:100%;padding:12px 16px 12px 44px;border:1.5px solid var(--color-contrast-low);border-radius:var(--radius-full);background:#fff;font-size:1rem}
.search input:focus{border-color:var(--color-primary)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--text-muted)}
.btn{border:0;border-radius:var(--btn-radius);padding:10px 18px;background:var(--color-primary);color:#fff;font-weight:700;cursor:pointer}
.btn:hover{background:var(--color-primary-light)}
.btn.ghost{background:transparent;color:var(--color-primary);box-shadow:inset 0 0 0 1.5px var(--color-primary)}
.btn.ghost:hover{background:var(--color-tertiary)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;min-height:0}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--color-primary);color:#fff;border:0;border-radius:var(--radius-full);padding:4px 6px 4px 12px;font-size:.85rem;cursor:pointer}
.pill i{font-style:normal;background:hsla(0,0%,100%,.2);border-radius:50%;width:18px;height:18px;line-height:18px;text-align:center}
.pill:hover i{background:var(--color-accent);color:var(--color-primary)}

/* cards & facets */
.grid{align-items:start;display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin:8px 0 28px}
.card{background:var(--surface-card);border-radius:var(--radius-lg);padding:18px 20px;box-shadow:var(--shadow-sm);min-width:0}
.card h2{font-size:1rem;color:var(--text-heading);margin-bottom:2px}
.card .sub{font-size:.8rem;color:var(--text-muted);margin-bottom:12px}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.facet{list-style:none;padding:0;display:flex;flex-direction:column;gap:4px}
.facet.scroll{max-height:290px;overflow:auto;padding-right:4px}
.row{display:grid;grid-template-columns:minmax(0,9.5rem) 1fr auto;gap:10px;align-items:center;width:100%;border:0;background:none;padding:5px 6px;border-radius:var(--radius-sm);cursor:pointer;text-align:left}
.row:hover{background:var(--color-bg-light)}
.row .lbl{font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .bar{height:12px;border-radius:6px;background:var(--color-tertiary);overflow:hidden}
.row .bar i{display:block;height:100%;background:var(--color-secondary-dark);border-radius:6px;transition:width var(--duration-base) var(--ease-out)}
.row .n{font-size:.85rem;font-variant-numeric:tabular-nums;min-width:2.6em;text-align:right;color:var(--text-muted)}
.row[aria-pressed=true]{background:var(--color-tertiary)}
.row[aria-pressed=true] .bar i{background:var(--color-primary)}
.row[aria-pressed=true] .lbl,.row[aria-pressed=true] .n{font-weight:700;color:var(--text-heading)}
.row.zero{opacity:.45}
#f-o .row{grid-template-columns:minmax(0,14rem) 1fr auto}

/* year chart */
.years{display:flex;align-items:flex-end;gap:3px;height:190px;padding-top:6px}
.yr{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border:0;background:none;padding:0;cursor:pointer;position:relative}
.yr .col{width:100%;background:var(--color-secondary-dark);border-radius:3px 3px 0 0;min-height:1px;transition:height var(--duration-base) var(--ease-out)}
.yr:hover .col{background:var(--color-accent-dark)}
.yr[aria-pressed=true] .col{background:var(--color-primary)}
.yr .cnt{font-size:.68rem;color:var(--text-muted);height:1.1em;font-variant-numeric:tabular-nums}
.yr[aria-pressed=true] .cnt{color:var(--text-heading);font-weight:700}
.axis{display:flex;gap:3px;border-top:1.5px solid var(--color-contrast-low);padding-top:4px}
.axis span{flex:1;font-size:.7rem;color:var(--text-muted);text-align:center;min-width:0;overflow:visible;white-space:nowrap}

/* results */
.results h2{font-family:var(--font-display);font-weight:500;font-size:1.7rem;color:var(--text-heading)}
.rhead{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.tablewrap{background:var(--surface-card);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;padding:0;border-bottom:2px solid var(--color-tertiary);white-space:nowrap}
th button{width:100%;text-align:left;border:0;background:none;padding:12px 14px;font-weight:700;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);cursor:pointer}
th button:hover{color:var(--text-heading)}
th[aria-sort] button{color:var(--text-heading)}
th[aria-sort=ascending] button::after{content:" ▲"}
th[aria-sort=descending] button::after{content:" ▼"}
td{padding:10px 14px;border-bottom:1px solid var(--color-bg-dark);vertical-align:top}
tbody tr:hover{background:var(--color-bg-lighter)}
td.name{font-weight:500;color:var(--text-heading);min-width:14rem}
td.name em{font-style:italic}
.tag{display:inline-block;padding:1px 9px;border-radius:var(--radius-full);font-size:.78rem;font-weight:500;background:var(--color-tertiary);color:var(--color-primary)}
.tag.W{background:var(--fwbg-sunstone);color:var(--fwbg-evergreen)}
.tag.Z{background:var(--fwbg-citrus);color:var(--fwbg-evergreen)}
.empty{padding:40px 20px;text-align:center;color:var(--text-muted)}
.more{display:flex;justify-content:center;gap:10px;padding:18px}
footer{padding:28px 20px 50px;font-size:.82rem;color:var(--text-muted)}
footer p+p{margin-top:6px}

@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.s4,.s5,.s7,.s8{grid-column:span 12}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.facet.wide .row{grid-template-columns:minmax(0,14rem) 1fr auto}
</style>
