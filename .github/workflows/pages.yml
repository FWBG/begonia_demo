name: Publish dashboards to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "begonia_dashboard*.html"
      - "build.py"
      - "build_react.py"
      - "src/**"
      - "data/source/**"
      - "fwbg/**"
      - "package*.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # Rebuild from source so the published pages can never lag behind the data or code.
      - name: Build both dashboards
        run: |
          python3 build.py
          python3 build.py --season fall
          python3 build_react.py

      - name: Assemble site
        run: |
          mkdir -p _site/react _site/fall
          cp begonia_dashboard.html _site/index.html
          cp begonia_dashboard_fall.html _site/fall/index.html
          cp begonia_dashboard_react.html _site/react/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
